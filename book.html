<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека индуизма</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="bookTitle">Бхагавад Гита</h1>
        <button class="theme-toggle" id="themeToggle">Ночной режим</button>
        <button class="back-button" id="backButton">← Назад</button>
    </header>

    <div class="container">
        <div class="book-header">
            <div class="book-image" id="bookImage"></div>
            <div class="book-info">
                <h2 id="bookSubtitle">Песнь Господа</h2>
                <p id="bookDescription">Беседа между Кришной и Арджуной перед началом великой битвы на Курукшетре</p>
                <div class="book-meta">
                    <span>Глав: <span id="chaptersCount">18</span></span>
                    <span>Стихов: <span id="versesCount">700</span></span>
                </div>
            </div>
        </div>
        
        <div class="chapters-container">
            <h2>Главы</h2>
            <div class="chapters-grid" id="chaptersGrid">
                <!-- Главы будут добавляться через JavaScript -->
            </div>
        </div>
    </div>

    <script src="book.js"></script>
</body>
</html>
