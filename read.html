<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чтение | Библиотека индуизма</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Marcellus&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="reading-page">
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="logo">
                <span class="om-symbol">ॐ</span>
                <span class="site-title">Библиотека индуизма</span>
            </a>
            <div class="header-actions">
                <a href="book.html" class="btn btn-ghost" id="backButton">← К главам</a>
                <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
                    <span class="theme-icon">🌙</span>
                    <span class="theme-text">Ночной режим</span>
                </button>
            </div>
        </div>
    </header>

    <main class="reading-layout">
        <aside class="reading-sidebar">
            <div class="sidebar-header">
                <h3 id="sidebarBookTitle">Книга</h3>
                <span class="sidebar-count" id="sidebarChapterCount"></span>
            </div>
            <ul class="chapter-list" id="chapterList">
                <!-- Рендерится через JS -->
            </ul>
        </aside>

        <article class="reading-content">
            <div class="reading-header">
                <span class="chapter-label" id="chapterLabel">Глава 1</span>
                <h1 class="reading-title" id="chapterTitle"></h1>
                <div class="ornament-line"></div>
            </div>

            <div class="image-container" id="imageContainer">
                <!-- Картинка главы (если есть) -->
            </div>

            <div class="verses" id="versesContainer">
                <!-- Стихи рендерятся через JS -->
            </div>

            <nav class="chapter-nav">
                <button class="btn btn-nav" id="prevChapter">← Предыдущая глава</button>
                <button class="btn btn-nav" id="nextChapter">Следующая глава →</button>
            </nav>

            <div class="progress-container">
                <div class="progress-label">
                    <span>Прогресс чтения</span>
                    <span id="progressText">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </article>
    </main>

    <footer class="site-footer">
        <div class="ornament">ॐ</div>
        <p>Пусть знание ведёт к свету</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/read.js"></script>
</body>
</html>
