<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека индуизма</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Библиотека индуизма</h1>
        <button class="theme-toggle" id="themeToggle">Ночной режим</button>
    </header>

    <div class="container">
        <h2 class="section-title">Священные тексты</h2>
        
        <div class="books-grid">
            <div class="book-card" data-book="bgita">
                <div class="book-cover" style="background: linear-gradient(135deg, #FF8C00, #FFD700);">
                    <h3>Бхагавад Гита</h3>
                </div>
                <p>Беседа Кришны и Арджуны</p>
            </div>
            
            <div class="book-card" data-book="upanishads">
                <div class="book-cover" style="background: linear-gradient(135deg, #993300, #FF8C00);">
                    <h3>Упанишады</h3>
                </div>
                <p>Философские тексты</p>
            </div>
            
            <div class="book-card" data-book="ramayana">
                <div class="book-cover" style="background: linear-gradient(135deg, #FFD700, #FFFFFF);">
                    <h3>Рамаяна</h3>
                </div>
                <p>Эпос о Раме и Сите</p>
            </div>
            
            <div class="book-card" data-book="mahabharata">
                <div class="book-cover" style="background: linear-gradient(135deg, #1A120B, #993300);">
                    <h3>Махабхарата</h3>
                </div>
                <p>Великий эпос</p>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
